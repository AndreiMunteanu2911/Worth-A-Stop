spring.application.name=location-review-platform
# MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/location_review_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=location_review
spring.datasource.password=${MYSQL_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.docker.compose.enabled=false

# Server
server.port=7171
