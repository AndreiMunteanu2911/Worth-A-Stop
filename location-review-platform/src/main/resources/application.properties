spring.application.name=location-review-platform
# MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/location_review_db
spring.datasource.username=location_review
spring.datasource.password=${MYSQL_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Schema migrations begin with the verified database design in P02.
spring.flyway.enabled=false
spring.docker.compose.enabled=false

# Server
server.port=7171
