<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="csrf-token" th:content="${_csrf.token}"><meta name="csrf-header" th:content="${_csrf.headerName}"><title >Account</title><link rel="stylesheet" th:href="@{/css/tokens.css}"><link rel="stylesheet" th:href="@{/css/base.css}"><link rel="stylesheet" th:href="@{/css/components.css}"><link rel="stylesheet" th:href="@{/css/account.css}"><script type="module" th:src="@{/js/shell.js}"></script></head><body><a class="skip-link" href="#main">Skip to content</a><div th:replace="~{fragments/shell :: header}"></div><main id="main" class="shell account-main"><span class="profile-initial" aria-hidden="true" th:text="${profile.avatarPlaceholder}"></span><h1 th:text="${profile.displayName}"></h1><p th:text="'@' + ${profile.username}"></p><p th:if="${!#strings.isEmpty(profile.biography)}" th:text="${profile.biography}"></p><p><span th:text="${profile.followerCount}"></span> followers · <span th:text="${profile.followingCount}"></span> following</p><p th:if="${owner}"><a th:href="@{/settings/profile}">Edit profile</a></p><section class="profile-section"><h2>Reviews</h2><p>Reviews are not available yet.</p></section><section class="profile-section"><h2>Collections</h2><p>Collections are not available yet.</p></section></main><div th:replace="~{fragments/shell :: footer}"></div></body></html>
