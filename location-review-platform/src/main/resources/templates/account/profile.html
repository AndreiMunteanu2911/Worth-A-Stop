<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="csrf-token" th:content="${_csrf.token}"><meta name="csrf-header" th:content="${_csrf.headerName}"><title th:text="${profile.displayName} + ' | Location Review Platform'">Profile</title><link rel="stylesheet" th:href="@{/css/tokens.css}"><link rel="stylesheet" th:href="@{/css/base.css}"><link rel="stylesheet" th:href="@{/css/components.css}"><link rel="stylesheet" th:href="@{/css/account.css}"><link rel="stylesheet" th:href="@{/css/collections.css}"><script type="module" th:src="@{/js/shell.js}"></script><script type="module" th:src="@{/js/follow.js}"></script></head><body><a class="skip-link" href="#main">Skip to content</a><div th:replace="~{fragments/shell :: header}"></div><main id="main" class="shell account-main">
    <header class="profile-heading">
        <div class="profile-identity">
            <span class="profile-initial" aria-hidden="true" th:text="${profile.avatarPlaceholder}"></span>
            <h1 th:text="${profile.displayName}"></h1>
            <p th:text="'@' + ${profile.username}"></p>
            <p th:unless="${#strings.isEmpty(profile.biography)}" th:text="${profile.biography}"></p>
            <div class="profile-connections">
                <a th:href="@{/users/{id}/followers(id=${profile.id})}"
                   th:text="${profile.followerCount == 1} ? '1 follower' : ${profile.followerCount} + ' followers'"></a>
                <a th:href="@{/users/{id}/following(id=${profile.id})}" th:text="${profile.followingCount} + ' following'"></a>
            </div>
        </div>
        <p th:if="${owner}"><a th:href="@{/settings/profile}">Edit profile</a></p>
        <p th:if="${viewerId == null}"><a th:href="@{/login}">Log in to follow</a></p>
        <form class="profile-follow" th:if="${viewerId != null and !owner}"
              method="post" th:action="@{/users/{id}/follow(id=${profile.id})}">
            <input type="hidden" name="following" th:value="${!following}">
            <button type="submit" th:classappend="${following} ? 'is-following'"
                    th:text="${following} ? 'Unfollow' : 'Follow'">Follow</button>
        </form>
    </header>
    <p th:if="${followNotice}" th:text="${followNotice}" role="status"></p>
    <section class="profile-section"><h2>Reviews</h2><p th:if="${#lists.isEmpty(reviews.items)}">No reviews yet.</p><article th:each="review : ${reviews.items}" class="profile-section"><p><a th:href="@{/places/{id}(id=${review.place.id})}" th:text="${review.place.name != null} ? ${review.place.name} : 'View place'"></a> · <span th:text="${review.rating} + ' / 5'"></span></p><p th:text="${review.createdAt}"></p><p th:if="${review.visitDate != null}" th:text="'Visited '+${review.visitDate}"></p><p th:text="${review.body}"></p><p th:if="${owner}"><a th:href="@{/reviews/{id}/edit(id=${review.id})}">Edit</a></p></article><nav aria-label="Review pages"><a th:if="${reviews.page > 0}" th:href="@{/users/{id}(id=${profile.id},page=${reviews.page - 1},collectionPage=${collections.page})}">Previous</a> <span th:if="${reviews.totalPages > 0}" th:text="'Page ' + ${reviews.page + 1} + ' of ' + ${reviews.totalPages}"></span> <a th:if="${reviews.page + 1 < reviews.totalPages}" th:href="@{/users/{id}(id=${profile.id},page=${reviews.page + 1},collectionPage=${collections.page})}">Next</a></nav></section><section class="profile-section"><h2>Collections</h2><p th:if="${owner}"><a th:href="@{/collections(scope='mine')}">Manage my collections</a></p><p th:if="${#lists.isEmpty(collections.items)}">No public collections yet.</p><article th:each="collection : ${collections.items}" class="profile-section"><div th:replace="~{fragments/collections :: preview(${collection}, false)}"></div></article><nav aria-label="Collection pages"><a th:if="${collections.page > 0}" th:href="@{/users/{id}(id=${profile.id},page=${reviews.page},collectionPage=${collections.page - 1})}">Previous</a> <span th:if="${collections.totalPages > 0}" th:text="'Page ' + ${collections.page + 1} + ' of ' + ${collections.totalPages}"></span> <a th:if="${collections.page + 1 < collections.totalPages}" th:href="@{/users/{id}(id=${profile.id},page=${reviews.page},collectionPage=${collections.page + 1})}">Next</a></nav></section></main><div th:replace="~{fragments/shell :: footer}"></div></body></html>
