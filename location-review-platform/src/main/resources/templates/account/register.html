<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="csrf-token" th:content="${_csrf.token}"><meta name="csrf-header" th:content="${_csrf.headerName}"><title>Create an account | Location Review Platform</title><link rel="stylesheet" th:href="@{/css/tokens.css}"><link rel="stylesheet" th:href="@{/css/base.css}"><link rel="stylesheet" th:href="@{/css/components.css}"><link rel="stylesheet" th:href="@{/css/account.css}"><script type="module" th:src="@{/js/shell.js}"></script></head><body><a class="skip-link" href="#main">Skip to content</a><div th:replace="~{fragments/shell :: header}"></div><main id="main" tabindex="-1" class="shell account-main"><h1 class="section-title">Create an account</h1><p>Join to share your experiences.</p><p class="form-error" role="alert" th:if="${message}" th:text="${message}"></p><form class="account-form" method="post" th:action="@{/register}"><label for="username">Username</label><input id="username" name="username" type="text" th:value="${values.username}" autocomplete="username" th:attr="aria-invalid=${errors != null and errors.containsKey('username')},aria-describedby=${errors != null and errors.containsKey('username')} ? 'username-error' : null"><span th:replace="~{fragments/fields :: error(${errors}, 'username')}"></span><label for="email">Email</label><input id="email" name="email" type="email" th:value="${values.email}" autocomplete="email" th:attr="aria-invalid=${errors != null and errors.containsKey('email')},aria-describedby=${errors != null and errors.containsKey('email')} ? 'email-error' : null"><span th:replace="~{fragments/fields :: error(${errors}, 'email')}"></span><label for="displayName">Display name</label><input id="displayName" name="displayName" type="text" th:value="${values.displayName}" autocomplete="name" th:attr="aria-invalid=${errors != null and errors.containsKey('displayName')},aria-describedby=${errors != null and errors.containsKey('displayName')} ? 'displayName-error' : null"><span th:replace="~{fragments/fields :: error(${errors}, 'displayName')}"></span><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" th:attr="aria-invalid=${errors != null and errors.containsKey('password')},aria-describedby=${errors != null and errors.containsKey('password')} ? 'password-help password-error' : 'password-help'"><span th:replace="~{fragments/fields :: error(${errors}, 'password')}"></span><p id="password-help">Use a password of 12–72 UTF-8 bytes.</p><button type="submit">Create account</button></form><p>Already registered? <a th:href="@{/login}">Log in</a>.</p></main><div th:replace="~{fragments/shell :: footer}"></div></body></html>
