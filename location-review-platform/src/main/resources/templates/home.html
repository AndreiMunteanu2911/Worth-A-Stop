<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" th:content="${_csrf.token}">
    <meta name="csrf-header" th:content="${_csrf.headerName}">
    <title>Location Review Platform</title>
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <script type="module" th:src="@{/js/shell.js}"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div th:replace="~{fragments/shell :: header}"></div>
<main id="main" tabindex="-1" class="shell home-main">
    <div class="home-grid">
        <section>
            <p class="eyebrow">A guide shaped by your experiences</p>
            <h1>Discover places worth <em>talking about.</em></h1>
        </section>
        <aside class="home-intro">
            <form method="get" th:action="@{/explore}">
                <label for="home-search">Find a place by name or area</label>
                <div class="search-controls">
                    <input id="home-search" name="q" type="search" minlength="2" maxlength="100" required>
                    <button type="submit">Search</button>
                </div>
            </form>
            <p><a th:href="@{/explore}">Open Explore</a></p>
        </aside>
    </div>
    <section class="home-feature" th:unless="${#lists.isEmpty(recentReviews)}"
             th:with="latest=${recentReviews[0]}">
        <h2>Recently reviewed</h2>
        <a th:href="@{/places/{id}(id=${latest.place.id})}"
           th:text="${latest.place.name ?: 'View reviewed place'}"></a>
    </section>
    <section class="home-section" th:unless="${#lists.isEmpty(recentReviews)}">
        <h2>Recent reviews</h2>
        <ul class="home-items" role="list">
            <li th:each="review : ${recentReviews}">
                <a th:href="@{/reviews/{id}(id=${review.id})}"
                   th:text="${review.place.name != null ? 'Review of ' + review.place.name : 'Place review'}"></a>
                <p class="home-meta"><a th:href="@{/users/{id}(id=${review.author.id})}" th:text="${review.author.displayName}"></a>
                    · <span th:text="${review.rating} + ' / 5'"></span></p>
                <p th:text="${review.excerpt}"></p>
            </li>
        </ul>
    </section>
    <section class="home-section" th:unless="${#lists.isEmpty(publicCollections)}">
        <h2>Public collections</h2>
        <ul class="home-items home-guides" role="list">
            <li th:each="collection : ${publicCollections}">
                <a th:href="@{/collections/{id}(id=${collection.id})}" th:text="${collection.title}"></a>
            </li>
        </ul>
    </section>
</main>
<div th:replace="~{fragments/shell :: footer}"></div>
</body>
</html>
