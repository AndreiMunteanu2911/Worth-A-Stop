<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Collections | Location Review Platform</title><link rel="stylesheet" th:href="@{/css/tokens.css}"><link rel="stylesheet" th:href="@{/css/base.css}"><link rel="stylesheet" th:href="@{/css/components.css}"><link rel="stylesheet" th:href="@{/css/account.css}"><link rel="stylesheet" th:href="@{/css/collections.css}"><script type="module" th:src="@{/js/shell.js}"></script></head><body><a class="skip-link" href="#main">Skip to content</a><div th:replace="~{fragments/shell :: header}"></div><main id="main" tabindex="-1" class="shell account-main collections-main">
<p><a th:href="@{/collections(scope='mine')}">My collections</a></p><h1 class="section-title" th:text="${collectionId == null} ? 'Create a collection' : 'Edit collection'"></h1>
<p>Start with a title. An empty collection is welcome; add places as you discover them.</p>
<p th:if="${message != null}" role="alert" class="form-error" th:text="${message}"></p>
<form class="account-form" method="post" th:action="${collectionId == null} ? @{/collections/new} : @{/collections/{id}/edit(id=${collectionId})}">
<label for="title">Title</label><input id="title" name="title" required maxlength="100" th:value="${values.title}" th:attr="aria-invalid=${errors != null and errors.containsKey('title')} ? 'true' : null,aria-describedby=${errors != null and errors.containsKey('title')} ? 'title-error' : null"><span th:replace="~{fragments/fields :: error(${errors}, 'title')}"></span>
<label for="description">Description</label><textarea id="description" name="description" maxlength="1000" th:text="${values.description}" th:attr="aria-invalid=${errors != null and errors.containsKey('description')} ? 'true' : null,aria-describedby=${errors != null and errors.containsKey('description')} ? 'description-error' : null"></textarea><span th:replace="~{fragments/fields :: error(${errors}, 'description')}"></span>
<label for="visibility">Visibility</label><select id="visibility" name="visibility"><option value="PRIVATE" th:selected="${values.visibility.name() == 'PRIVATE'}">Private — only you</option><option value="PUBLIC" th:selected="${values.visibility.name() == 'PUBLIC'}">Public — anyone</option></select><p>Making a private collection public publishes it again. Editing a public collection keeps its publication date.</p>
<button type="submit">Save collection</button> <a th:href="${collectionId == null} ? @{/collections(scope='mine')} : @{/collections/{id}(id=${collectionId})}">Cancel</a></form>
</main><div th:replace="~{fragments/shell :: footer}"></div></body></html>
