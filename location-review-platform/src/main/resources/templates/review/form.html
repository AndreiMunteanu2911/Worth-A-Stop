<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${reviewId == null} ? 'Write a review | Location Review Platform' : 'Edit review | Location Review Platform'">Write a review</title><link rel="stylesheet" th:href="@{/css/tokens.css}"><link rel="stylesheet" th:href="@{/css/base.css}"><link rel="stylesheet" th:href="@{/css/components.css}"><link rel="stylesheet" th:href="@{/css/account.css}"><script type="module" th:src="@{/js/shell.js}"></script></head><body><a class="skip-link" href="#main">Skip to content</a><div th:replace="~{fragments/shell :: header}"></div><main id="main" tabindex="-1" class="shell account-main"><p><a th:href="@{/places/{id}(id=${placeId})}">Back to place</a></p><h1 class="section-title" th:text="${reviewId == null} ? 'Write a review' : 'Edit your review'"></h1><p class="form-error" role="alert" th:if="${message}" th:text="${message}"></p><form class="account-form" method="post" th:action="${reviewId == null} ? @{/reviews/new} : @{/reviews/{id}/edit(id=${reviewId})}"><input type="hidden" name="placeId" th:value="${placeId}"><fieldset th:attr="aria-invalid=${errors != null and errors.containsKey('rating')} ? 'true' : null,aria-describedby=${errors != null and errors.containsKey('rating')} ? 'rating-error' : null"><legend>Rating, 1 to 5</legend><label th:each="n : ${#numbers.sequence(1,5)}"><input type="radio" name="rating" th:value="${n}" th:checked="${#strings.toString(rating) == #strings.toString(n)}" required> <span th:text="${n} + ' / 5'"></span></label></fieldset><span th:replace="~{fragments/fields :: error(${errors}, 'rating')}"></span><label for="body">Your review (10–5000 characters)</label><textarea id="body" name="body" required minlength="10" maxlength="5000" rows="8" th:text="${body}" th:attr="aria-invalid=${errors != null and errors.containsKey('body')} ? 'true' : null,aria-describedby=${errors != null and errors.containsKey('body')} ? 'body-error' : null"></textarea><span th:replace="~{fragments/fields :: error(${errors}, 'body')}"></span><label for="visitDate">Visit date (optional)</label><input id="visitDate" type="date" name="visitDate" th:value="${visitDate}" th:attr="aria-invalid=${errors != null and errors.containsKey('visitDate')} ? 'true' : null,aria-describedby=${errors != null and errors.containsKey('visitDate')} ? 'visitDate-error' : null"><span th:replace="~{fragments/fields :: error(${errors}, 'visitDate')}"></span><button type="submit">Save review</button> <a th:href="@{/places/{id}(id=${placeId})}">Cancel</a></form></main><div th:replace="~{fragments/shell :: footer}"></div></body></html>
