<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Review discussion | Location Review Platform</title>
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/account.css}">
    <link rel="stylesheet" th:href="@{/css/reviews.css}">
    <script type="module" th:src="@{/js/shell.js}"></script>
    <script type="module" th:src="@{/js/review-discussion.js}"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div th:replace="~{fragments/shell :: header}"></div>
<main id="main" tabindex="-1" class="shell account-main">
    <div class="review-reading">
        <h1 class="section-title">Review discussion</h1>
        <article>
            <p class="review-meta">
                <a th:href="@{/users/{id}(id=${review.author.id})}" th:text="${review.author.displayName}">Author</a>
                · <a th:href="@{/places/{id}(id=${review.place.id})}" th:text="${review.place.name ?: 'View place'}">View place</a>
                · <span th:text="${review.rating} + ' / 5'"></span>
                · <time th:datetime="${review.createdAt}" th:text="${#strings.substring(review.createdAt.toString(), 0, 10)}"></time>
            </p>
            <p class="review-meta" th:if="${review.visitDate != null}" th:text="'Visited ' + ${review.visitDate}"></p>
            <p class="review-copy" th:text="${review.body}"></p>
            <div id="review-likes" class="review-actions">
                <span th:text="${review.likeCount == 1} ? '1 like' : ${review.likeCount} + ' likes'">0 likes</span>
                <form th:if="${viewerId != null}" method="post" th:action="@{/reviews/{id}/like(id=${review.id})}"
                      data-review-submit="Updating…">
                    <input type="hidden" name="liked" th:value="${!review.likedByMe}">
                    <input type="hidden" name="page" th:value="${comments.page}">
                    <button type="submit" class="review-action" th:classappend="${review.likedByMe} ? 'is-liked'"
                            th:text="${review.likedByMe} ? 'Unlike' : 'Like'">Like</button>
                </form>
                <a th:if="${viewerId == null}" th:href="@{/login}">Log in to like</a>
                <a th:if="${viewerId == review.author.id.toString()}"
                   th:href="@{/reviews/{id}/edit(id=${review.id})}">Edit review</a>
            </div>
            <p class="review-feedback" th:if="${likeNotice}" th:text="${likeNotice}" role="status"></p>
        </article>
        <section id="comments" class="review-comments" aria-labelledby="comments-heading">
            <h2 id="comments-heading">Comments <span class="review-comment-count" th:text="${comments.totalElements}"></span></h2>
            <p class="review-feedback" th:if="${commentNotice}" th:text="${commentNotice}" role="status"></p>
            <p th:if="${comments.totalElements == 0}">No comments yet.</p>
            <p th:if="${comments.totalElements > 0 and #lists.isEmpty(comments.items)}">No comments on this page.</p>
            <ol class="review-comment-list" th:unless="${#lists.isEmpty(comments.items)}">
                <li th:each="comment : ${comments.items}">
                    <p class="review-meta">
                        <a th:href="@{/users/{id}(id=${comment.author.id})}" th:text="${comment.author.displayName}"></a>
                        · <time th:datetime="${comment.createdAt}" th:text="${#strings.substring(comment.createdAt.toString(), 0, 10)}"></time>
                    </p>
                    <p class="review-copy" th:text="${comment.body}"></p>
                    <details th:if="${viewerId == comment.author.id.toString()}" class="delete-confirm">
                        <summary>Delete comment</summary>
                        <form method="post" th:action="@{/comments/{id}/delete(id=${comment.id})}"
                              data-review-submit="Deleting…">
                            <input type="hidden" name="page" th:value="${comments.page}">
                            <button class="review-action" type="submit">Confirm deletion</button>
                        </form>
                    </details>
                </li>
            </ol>
            <nav class="pagination" th:if="${comments.totalPages > 1 or comments.page > 0}" aria-label="Comment pages">
                <a th:if="${comments.page > 0}"
                   th:href="@{/reviews/{id}#comments(id=${review.id},page=${comments.page - 1})}">Previous</a>
                <span th:if="${comments.page < comments.totalPages}"
                      th:text="'Page ' + ${comments.page + 1} + ' of ' + ${comments.totalPages}"></span>
                <a th:if="${comments.page + 1 < comments.totalPages}"
                   th:href="@{/reviews/{id}#comments(id=${review.id},page=${comments.page + 1})}">Next</a>
            </nav>
            <form id="comment-form" class="account-form" th:if="${viewerId != null}" method="post"
                  th:action="@{/reviews/{id}/comments#comment-form(id=${review.id})}" data-review-submit="Posting…">
                <input type="hidden" name="page" th:value="${comments.page}">
                <label for="comment-body">Write a comment</label>
                <textarea id="comment-body" name="body" rows="4" required th:text="${commentBody}"
                          th:attr="aria-invalid=${commentError} ? 'true' : null,aria-describedby=${commentError} ? 'comment-limit comment-error' : 'comment-limit'"></textarea>
                <p id="comment-limit" class="review-meta">Up to 1000 characters.</p>
                <p id="comment-error" class="form-error" th:if="${commentError}" th:text="${commentError}" role="alert"></p>
                <button type="submit">Post comment</button>
            </form>
            <p th:if="${viewerId == null}"><a th:href="@{/login}">Log in to comment</a></p>
        </section>
    </div>
</main>
<div th:replace="~{fragments/shell :: footer}"></div>
</body>
</html>
