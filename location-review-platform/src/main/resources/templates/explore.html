<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Explore | Location Review Platform</title><link rel="stylesheet" th:href="@{/css/tokens.css}"><link rel="stylesheet" th:href="@{/css/base.css}"><link rel="stylesheet" th:href="@{/css/components.css}"><link rel="stylesheet" th:href="@{/css/explore.css}"><script type="module" th:src="@{/js/shell.js}"></script><script type="module" th:src="@{/js/explore.js}"></script></head><body><a class="skip-link" href="#main">Skip to content</a><div th:replace="~{fragments/shell :: header}"></div><main id="main" class="shell directory" th:attr="data-maps-key=${mapsBrowserKey}"><p class="eyebrow">Place directory</p><h1>Explore places</h1><form id="search-form"><label for="query">Name or area</label><div class="search-controls"><input id="query" name="q" type="search" minlength="2" maxlength="100" required><button type="submit">Search</button></div><p>Search is submitted explicitly. Results are a limited selection, not a complete directory.</p><label for="category">Category</label><select id="category" name="category"><option value="">All categories</option><option value="restaurant">Restaurants</option><option value="cafe">Cafes</option><option value="museum">Museums</option><option value="park">Parks</option><option value="lodging">Lodging</option><option value="shopping_mall">Shopping malls</option></select><label for="rating">Minimum local rating</label><select id="rating" name="minRating"><option value="">Any rating</option><option value="1">1 or higher</option><option value="2">2 or higher</option><option value="3">3 or higher</option><option value="4">4 or higher</option><option value="5">5</option></select><label for="sort">Sort search results</label><select id="sort" name="sort"><option value="relevance">Relevance</option><option value="rating">Local rating</option></select></form><p><button type="button" id="nearby">Find places near me</button></p><p id="status" role="status" aria-live="polite">Search for a place or use your location.</p><div class="view-tabs" role="group" aria-label="Result view"><button id="list-tab" type="button" aria-pressed="true">List</button><button id="map-tab" type="button" aria-pressed="false">Map</button></div><div class="explore-grid"><section id="list-panel" aria-label="Places"><ol id="results"></ol></section><div id="map-panel"><button type="button" id="search-area">Search near map center</button><div id="map" aria-label="Map of search results"></div><p id="map-status" role="status"></p></div></div><p id="attributions">Google Maps</p></main><div th:replace="~{fragments/shell :: footer}"></div></body></html>
