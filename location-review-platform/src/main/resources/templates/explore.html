<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Explore places | Location Review Platform</title>
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/explore.css}">
    <script type="module" th:src="@{/js/shell.js}"></script>
    <script type="module" th:src="@{/js/explore.js}"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div th:replace="~{fragments/shell :: header}"></div>
<main id="main" tabindex="-1" class="shell directory"
      th:attr="data-maps-key=${mapsBrowserKey},data-search-api=@{/api/v1/places/search},
               data-nearby-api=@{/api/v1/places/nearby},data-places-path=@{/places}">
    <h1 class="section-title">Explore places</h1>
    <form id="search-form" method="get" th:action="@{/explore}">
        <label for="query">Name or area</label>
        <div class="search-controls">
            <input id="query" name="q" type="search" minlength="2" maxlength="100" required th:value="${q}"
                   aria-describedby="search-help">
            <button type="submit">Search</button>
        </div>
        <p id="search-help">Each search returns up to 20 places. Ratings come from community reviews.</p>
        <div class="search-filters">
            <div>
                <label for="category">Category</label>
                <select id="category" name="category">
                    <option value="">All categories</option>
                    <option value="restaurant" th:selected="${category == 'restaurant'}">Restaurants</option>
                    <option value="cafe" th:selected="${category == 'cafe'}">Cafes</option>
                    <option value="museum" th:selected="${category == 'museum'}">Museums</option>
                    <option value="park" th:selected="${category == 'park'}">Parks</option>
                    <option value="lodging" th:selected="${category == 'lodging'}">Lodging</option>
                    <option value="shopping_mall" th:selected="${category == 'shopping_mall'}">Shopping malls</option>
                </select>
            </div>
            <div>
                <label for="rating">Minimum local rating</label>
                <select id="rating" name="minRating">
                    <option value="">Any rating</option>
                    <option th:each="n : ${#numbers.sequence(1,5)}" th:value="${n}"
                            th:selected="${minRating == n.toString()}" th:text="${n} + ' or higher'"></option>
                </select>
            </div>
            <div>
                <label for="sort">Sort search results</label>
                <select id="sort" name="sort">
                    <option value="relevance">Relevance</option>
                    <option value="rating" th:selected="${sort == 'rating'}">Local rating</option>
                </select>
            </div>
        </div>
    </form>
    <p id="nearby-controls" hidden><button type="button" id="nearby">Find places near me</button></p>
    <p id="search-error" role="alert" th:hidden="${searchError == null}" th:text="${searchError}"></p>
    <p id="status" role="status"
       th:text="${searchError != null ? '' : (searchResults == null ? 'Search by name or area.' :
                (searchResults.items.isEmpty() ? 'No places found. Try another search.' :
                (searchResults.items.size() == 1 ? '1 place found.' : searchResults.items.size() + ' places found.')
                + (searchResults.truncated ? ' Results are limited.' : '')))}">
        Search by name or area.
    </p>
    <div class="view-tabs" role="group" aria-label="Result view">
        <button id="list-tab" type="button" aria-pressed="true" aria-controls="list-panel">List</button>
        <button id="map-tab" type="button" aria-pressed="false" aria-controls="map-panel">Map</button>
    </div>
    <div class="explore-grid">
        <section id="list-panel" aria-label="Places">
            <ol id="results" role="list">
                <th:block th:if="${searchResults != null}">
                <li th:each="place : ${searchResults.items}"
                    th:attr="data-lat=${place.latitude},data-lon=${place.longitude}">
                    <p class="eyebrow" th:if="${place.category}" th:text="${#strings.replace(place.category, '_', ' ')}"></p>
                    <a th:href="${place.id != null} ? @{/places/{id}(id=${place.id})} : @{/places/google/{id}(id=${place.googlePlaceId})}"
                       th:text="${place.name}"></a>
                    <p th:if="${!#strings.isEmpty(place.address)}" th:text="${place.address}"></p>
                    <p class="result-meta" th:text="${place.reviewCount > 0 ?
                        #numbers.formatDecimal(place.averageRating, 1, 1) + ' / 5 · ' + place.reviewCount + ' community reviews' :
                        'No community reviews yet.'}"></p>
                </li>
                </th:block>
            </ol>
        </section>
        <section id="map-panel" aria-label="Map" hidden>
            <button type="button" id="search-area" disabled>Search near map center</button>
            <div id="map" aria-label="Map of search results"></div>
            <p id="map-status" role="status"></p>
        </section>
    </div>
    <p id="attributions">
        <span>Google Maps</span><span th:each="attribution : ${attributions}"> ·
            <a th:if="${attribution.providerUri != null}" th:href="${attribution.providerUri}" th:text="${attribution.provider}"></a>
            <span th:unless="${attribution.providerUri != null}" th:text="${attribution.provider}"></span>
        </span>
    </p>
</main>
<div th:replace="~{fragments/shell :: footer}"></div>
</body>
</html>
