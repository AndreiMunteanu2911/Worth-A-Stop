<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="csrf-token" th:content="${_csrf.token}"><meta name="csrf-header" th:content="${_csrf.headerName}"><title>Place | Location Review Platform</title><link rel="stylesheet" th:href="@{/css/tokens.css}"><link rel="stylesheet" th:href="@{/css/base.css}"><link rel="stylesheet" th:href="@{/css/components.css}"><link rel="stylesheet" th:href="@{/css/explore.css}"><link rel="stylesheet" th:href="@{/css/bookmarks.css}"><script type="module" th:src="@{/js/shell.js}"></script><script type="module" th:src="@{/js/place.js}"></script></head><body><a class="skip-link" href="#main">Skip to content</a><div th:replace="~{fragments/shell :: header}"></div><main id="main" class="shell directory" th:attr="data-api=${placeApi},data-bookmarked=${bookmarked},data-signed-in=${viewerId != null},data-viewer-id=${viewerId},data-maps-key=${mapsBrowserKey}"><p><a href="/explore">← Explore</a></p><p id="status" role="status">Loading place…</p><article id="place" hidden><p class="eyebrow" id="category"></p><h1 id="name"></h1><p id="address"></p><p id="rating"></p><p id="contact" hidden></p><ul id="opening-hours" hidden></ul><div class="bookmark-controls"><button class="bookmark-action" id="bookmark" type="button" hidden>Save place</button><a id="bookmark-login" th:href="@{/login}" hidden>Log in to save this place</a><button id="resolve" type="button" hidden>Enable reviews and collections</button></div><p id="bookmark-status" role="status"></p><p><a id="collection-action" hidden></a></p><div id="map" aria-label="Map showing the location"></div><section><h2>Reviews</h2><p id="review-action"></p><p id="reviews-status" role="status">Loading reviews…</p><label for="reviews-sort">Sort reviews</label> <select id="reviews-sort"><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="rating_high">Highest rating</option><option value="rating_low">Lowest rating</option></select><div id="review-list"></div><nav aria-label="Review pages"><button type="button" id="reviews-prev" hidden>Previous</button> <span id="reviews-page"></span> <button type="button" id="reviews-next" hidden>Next</button></nav></section><section><h2>More places</h2><p id="recommendation-status">No nearby reviewed places to recommend yet.</p><ul id="recommendations"></ul></section><p id="map-status" role="status"></p><p id="attributions">Google Maps</p></article></main><div th:replace="~{fragments/shell :: footer}"></div></body></html>
