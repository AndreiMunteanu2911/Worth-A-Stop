<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="csrf-token" th:content="${_csrf.token}"><meta name="csrf-header" th:content="${_csrf.headerName}"><title>Log in | Worth a Stop</title><link rel="stylesheet" th:href="@{/css/tokens.css}"><link rel="stylesheet" th:href="@{/css/base.css}"><link rel="stylesheet" th:href="@{/css/components.css}"><link rel="stylesheet" th:href="@{/css/account.css}"><script type="module" th:src="@{/js/shell.js}"></script></head><body><a class="skip-link" href="#main">Skip to content</a><div th:replace="~{fragments/shell :: header}"></div><main id="main" tabindex="-1" class="shell account-main"><h1 class="section-title">Log in</h1><p class="form-error" role="alert" th:if="${param.error}">Invalid username, email or password.</p><p role="status" th:if="${param.logout}">You are signed out.</p><form class="account-form" method="post" th:action="@{/login}"><label for="username">Username or email</label><input id="username" name="username" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Log in</button></form><p>New here? <a th:href="@{/register}">Create an account</a>.</p></main><div th:replace="~{fragments/shell :: footer}"></div></body></html>
