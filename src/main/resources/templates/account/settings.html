<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="csrf-token" th:content="${_csrf.token}"><meta name="csrf-header" th:content="${_csrf.headerName}"><title>Profile settings | Worth a Stop</title><link rel="stylesheet" th:href="@{/css/tokens.css}"><link rel="stylesheet" th:href="@{/css/base.css}"><link rel="stylesheet" th:href="@{/css/components.css}"><link rel="stylesheet" th:href="@{/css/account.css}"><script type="module" th:src="@{/js/shell.js}"></script></head><body><a class="skip-link" href="#main">Skip to content</a><div th:replace="~{fragments/shell :: header}"></div><main id="main" tabindex="-1" class="shell account-main"><h1 class="section-title">Profile settings</h1><p role="status" th:if="${param.saved}">Your profile was saved.</p><p class="form-error" role="alert" th:if="${message}" th:text="${message}"></p><form class="account-form" method="post" th:action="@{/settings/profile}"><label for="username">Username</label><input id="username" name="username" type="text" th:value="${values.username}" autocomplete="username" th:attr="aria-invalid=${errors != null and errors.containsKey('username')},aria-describedby=${errors != null and errors.containsKey('username')} ? 'username-error' : null"><span th:replace="~{fragments/fields :: error(${errors}, 'username')}"></span><label for="email">Email</label><input id="email" name="email" type="email" th:value="${values.email}" autocomplete="email" th:attr="aria-invalid=${errors != null and errors.containsKey('email')},aria-describedby=${errors != null and errors.containsKey('email')} ? 'email-error' : null"><span th:replace="~{fragments/fields :: error(${errors}, 'email')}"></span><label for="displayName">Display name</label><input id="displayName" name="displayName" type="text" th:value="${values.displayName}" autocomplete="name" th:attr="aria-invalid=${errors != null and errors.containsKey('displayName')},aria-describedby=${errors != null and errors.containsKey('displayName')} ? 'displayName-error' : null"><span th:replace="~{fragments/fields :: error(${errors}, 'displayName')}"></span><label for="biography">Biography</label><textarea id="biography" name="biography" th:text="${values.biography}" th:attr="aria-invalid=${errors != null and errors.containsKey('biography')},aria-describedby=${errors != null and errors.containsKey('biography')} ? 'biography-error' : null"></textarea><span th:replace="~{fragments/fields :: error(${errors}, 'biography')}"></span><button type="submit">Save profile</button></form></main><div th:replace="~{fragments/shell :: footer}"></div></body></html>
