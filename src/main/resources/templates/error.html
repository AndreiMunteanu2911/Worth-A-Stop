<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page unavailable | Worth a Stop</title>
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/account.css}">
    <script type="module" th:src="@{/js/shell.js}"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div th:replace="~{fragments/shell :: header}"></div>
<main id="main" tabindex="-1" class="shell account-main">
    <h1 class="section-title" th:text="${status == 404 ? 'Page not found' : 'Page unavailable'}">Page unavailable</h1>
    <p th:switch="${status}">
        <span th:case="400">Check the address or try submitting the form again.</span>
        <span th:case="403">You don’t have access to this action.</span>
        <span th:case="404">The address may have changed or the page may have been removed.</span>
        <span th:case="*">Try again in a moment.</span>
    </p>
    <a th:href="@{/}">Return home</a>
</main>
<div th:replace="~{fragments/shell :: footer}"></div>
</body>
</html>
