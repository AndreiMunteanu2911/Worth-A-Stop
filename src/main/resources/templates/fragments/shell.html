<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="site-header">
    <div class="shell header-inner">
        <a class="wordmark" th:href="@{/}" aria-label="Worth a Stop home">Worth a <span>Stop</span></a>
        <button class="menu-toggle" type="button" aria-controls="site-nav" aria-expanded="false">Menu</button>
        <nav id="site-nav" aria-label="Main navigation">
            <a th:href="@{/}" th:attr="aria-current=${navigationPath == '/'} ? 'page' : null">Home</a>
            <a th:href="@{/explore}" th:attr="aria-current=${navigationPath == '/explore'} ? 'page' : null">Explore</a>
            <a th:href="@{/people}" th:attr="aria-current=${navigationPath == '/people'} ? 'page' : null">People</a>
            <a th:if="${viewerId != null}" th:href="@{/feed}" th:attr="aria-current=${navigationPath == '/feed'} ? 'page' : null">Feed</a>
            <a th:href="@{/collections}" th:attr="aria-current=${navigationPath == '/collections'} ? 'page' : null">Collections</a>
            <a th:if="${viewerId != null}" th:href="@{/saved}" th:attr="aria-current=${navigationPath == '/saved'} ? 'page' : null">Saved</a>
            <a th:if="${viewerId == null}" th:href="@{/login}" th:attr="aria-current=${navigationPath == '/login'} ? 'page' : null">Log in</a>
            <a th:if="${viewerId == null}" th:href="@{/register}" th:attr="aria-current=${navigationPath == '/register'} ? 'page' : null">Register</a>
            <a th:if="${viewerId != null}" th:href="@{/users/{id}(id=${viewerId})}"
               th:attr="aria-current=${navigationPath == '/users/' + viewerId} ? 'page' : null">My profile</a>
            <a th:if="${viewerId != null}" th:href="@{/settings/profile}"
               th:attr="aria-current=${navigationPath == '/settings/profile'} ? 'page' : null">Settings</a>
            <form th:if="${viewerId != null}" method="post" th:action="@{/logout}"><button class="nav-action" type="submit">Log out</button></form>
        </nav>
    </div>
</header>
<footer th:fragment="footer" class="site-footer">
    <div class="shell footer-inner">
        <span>Worth a Stop</span>
        <span><a th:href="@{/privacy}">Privacy</a> · <a th:href="@{/terms}">Terms</a> · <a th:href="@{/swagger-ui.html}">API documentation</a></span>
    </div>
</footer>
</body>
</html>
